name: Android build

on:
  push:
    branches:
      - main
    paths-ignore:
      - android-release/app-release.apk

permissions:
  contents: write

concurrency:
  group: android-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Analyze, test, and build APK
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: "3.47.6"

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze

      - name: Run tests
        run: flutter test

      - name: Build release APK
        run: flutter build apk --release

      - name: Publish APK to main
        env:
          SOURCE_SHA: ${{ github.sha }}
        run: |
          remote_sha="$(git ls-remote origin refs/heads/main | cut -f1)"
          if [ "$remote_sha" != "$SOURCE_SHA" ]; then
            echo "main advanced during this build; skipping stale APK publication."
            exit 0
          fi

          mkdir -p android-release
          cp build/app/outputs/flutter-apk/app-release.apk android-release/app-release.apk
          git add -f android-release/app-release.apk

          if git diff --cached --quiet; then
            echo "The APK is unchanged; no repository commit is needed."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Publish Android release APK" \
            -m "Built from source commit ${SOURCE_SHA}." \
            -m "Co-authored-by: Copilot <223556219+Copilot@users.noreply.github.com>"
          git push origin HEAD:main

      - name: Upload release APK
        uses: actions/upload-artifact@v4
        with:
          name: kanakku-note-android-${{ github.sha }}
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
